[project]
name = "django-assignment"
version = "0.1.0"
requires-python = ">=3.14.7"
dependencies = [
    "django==6.1.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"