{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Material Catalog{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}" />
  </head>
  <body class="catalog-page">
    <header class="site-header">
      <div class="site-header-inner">
        <p class="catalog-identity">Material catalog</p>
      </div>
    </header>
    <main class="catalog-frame">{% block content %}{% endblock %}</main>
  </body>
</html>
